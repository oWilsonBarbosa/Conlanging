name: Deploy app to GitHub Pages

# Publishes the static Phonological Inventory Builder (app/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# After that, every push to main that touches app/ redeploys. You can also run
# it manually (Actions tab -> this workflow -> "Run workflow") from any branch.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app          # serve app/ as the site root
      - id: deployment
        uses: actions/deploy-pages@v4
